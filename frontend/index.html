<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chiron - AI-Powered Job Search</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="logo">Chiron</h1>
            <ul class="nav-menu">
                <li><a href="#profile" class="nav-link">Profile</a></li>
                <li><a href="#jobs" class="nav-link">Job Suggestions</a></li>
                <li><a href="#applications" class="nav-link">Applications</a></li>
                <li><a href="#cover-letters" class="nav-link">Cover Letters</a></li>
            </ul>
        </div>
    </nav>

    <main class="main-content">
        <!-- Profile Section -->
        <section id="profile" class="section hidden">
            <h2>User Profile</h2>
            <div class="profile-container">
                <form id="profile-form" class="profile-form">
                    <div class="form-group">
                        <label for="user-email">Email</label>
                        <input type="email" id="user-email" required>
                    </div>
                    <div class="form-group">
                        <label for="user-name">Name</label>
                        <input type="text" id="user-name" required>
                    </div>
                    <div class="form-group">
                        <label for="user-location">Location</label>
                        <input type="text" id="user-location" placeholder="City, State">
                    </div>
                    <div class="form-group">
                        <label for="user-skills">Skills (comma-separated)</label>
                        <textarea id="user-skills" rows="3" placeholder="Python, JavaScript, React..."></textarea>
                    </div>
                    <div class="form-group">
                        <label for="experience-level">Experience Level</label>
                        <select id="experience-level">
                            <option value="entry">Entry Level</option>
                            <option value="mid">Mid Level</option>
                            <option value="senior">Senior Level</option>
                            <option value="executive">Executive</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="resume-upload">Upload Resume (PDF or DOCX)</label>
                        <input type="file" id="resume-upload" accept=".pdf,.docx,.doc">
                    </div>
                    <button type="submit" class="btn btn-primary">Save Profile</button>
                </form>
            </div>
        </section>

        <!-- Job Suggestions Section -->
        <section id="jobs" class="section hidden">
            <h2>Job Suggestions</h2>
            <div class="jobs-container">
                <div class="jobs-controls">
                    <input type="text" id="job-search" placeholder="Search jobs..." class="search-input">
                    <button id="refresh-jobs" class="btn btn-secondary">Refresh</button>
                </div>
                <div id="jobs-list" class="jobs-list"></div>
            </div>
        </section>

        <!-- Applications Section -->
        <section id="applications" class="section hidden">
            <h2>Application Tracking</h2>
            <div class="applications-container">
                <div class="applications-controls">
                    <button id="add-application-btn" class="btn btn-primary">Add Application</button>
                    <button id="sync-emails-btn" class="btn btn-secondary">Sync Emails</button>
                </div>
                
                <!-- Manual Entry Form -->
                <div id="application-form-container" class="form-container hidden">
                    <form id="application-form" class="application-form">
                        <h3>Add Application</h3>
                        <div class="form-group">
                            <label for="app-job-title">Job Title</label>
                            <input type="text" id="app-job-title" required>
                        </div>
                        <div class="form-group">
                            <label for="app-company">Company</label>
                            <input type="text" id="app-company" required>
                        </div>
                        <div class="form-group">
                            <label for="app-status">Status</label>
                            <select id="app-status">
                                <option value="active">Active</option>
                                <option value="interested">Interested/Needs Attention</option>
                                <option value="closed">Closed</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="app-date">Applied Date</label>
                            <input type="date" id="app-date">
                        </div>
                        <div class="form-group">
                            <label for="app-notes">Notes</label>
                            <textarea id="app-notes" rows="3"></textarea>
                        </div>
                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary">Save</button>
                            <button type="button" id="cancel-application" class="btn btn-secondary">Cancel</button>
                        </div>
                    </form>
                </div>

                <!-- Applications Dashboard -->
                <div class="applications-dashboard">
                    <div class="status-columns">
                        <div class="status-column">
                            <h3>Active</h3>
                            <div id="applications-active" class="applications-list"></div>
                        </div>
                        <div class="status-column">
                            <h3>Interested/Needs Attention</h3>
                            <div id="applications-interested" class="applications-list"></div>
                        </div>
                        <div class="status-column">
                            <h3>Closed</h3>
                            <div id="applications-closed" class="applications-list"></div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Cover Letters Section -->
        <section id="cover-letters" class="section hidden">
            <h2>Cover Letter Generator</h2>
            <div class="cover-letters-container">
                <div class="cover-letter-controls">
                    <select id="cover-letter-application" class="select-input">
                        <option value="">Select Application</option>
                    </select>
                    <select id="cover-letter-tone" class="select-input">
                        <option value="professional">Professional</option>
                        <option value="friendly">Friendly</option>
                        <option value="enthusiastic">Enthusiastic</option>
                        <option value="confident">Confident</option>
                    </select>
                    <select id="cover-letter-length" class="select-input">
                        <option value="short">Short</option>
                        <option value="medium" selected>Medium</option>
                        <option value="long">Long</option>
                    </select>
                    <button id="generate-cover-letter" class="btn btn-primary">Generate</button>
                </div>
                <div id="cover-letter-preview" class="cover-letter-preview"></div>
                <div id="cover-letter-versions" class="cover-letter-versions"></div>
            </div>
        </section>
    </main>

    <script src="js/api.js"></script>
    <script src="js/profile.js"></script>
    <script src="js/jobs.js"></script>
    <script src="js/applications.js"></script>
    <script src="js/cover_letters.js"></script>
    <script>
        // Navigation
        document.querySelectorAll('.nav-link').forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                const target = link.getAttribute('href').substring(1);
                document.querySelectorAll('.section').forEach(section => {
                    section.classList.add('hidden');
                });
                document.getElementById(target).classList.remove('hidden');
            });
        });

        // Show profile by default
        document.getElementById('profile').classList.remove('hidden');
    </script>
</body>
</html>
